<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Management</title><link rel="stylesheet" href="portal.css"></head><body><main class="portal"><header><div><span>🎓 Qazi Institute Admin</span><h1>Management Center</h1></div><button onclick="adminLogout()">Logout</button></header><section class="grid"><article><h2>Departments</h2><form id="dep"><input id="depName" placeholder="Department name" required><input id="depCode" placeholder="Code" required><button>Add</button></form><div id="deps"></div></article><article><h2>Subjects</h2><form id="sub"><input id="subName" placeholder="Subject name" required><input id="subCode" placeholder="Code" required><input id="subSem" type="number" placeholder="Semester" required><button>Add</button></form><div id="subs"></div></article><article><h2>Notices</h2><form id="notice"><input id="noticeTitle" placeholder="Title" required><textarea id="noticeMsg" placeholder="Notice" required></textarea><button>Publish</button></form><div id="notices"></div></article><article><h2>Fees</h2><form id="fee"><input id="feeStudent" placeholder="Student ID" required><input id="feeTitle" placeholder="Fee title" required><input id="feeAmount" type="number" placeholder="Amount" required><input id="feePaid" type="number" placeholder="Paid" value="0"><button>Add Fee</button></form><div id="fees"></div></article><article><h2>Faculty</h2><form id="fac"><input id="facName" placeholder="Name" required><input id="facId" placeholder="Employee ID" required><input id="facEmail" type="email" placeholder="Email" required><input id="facDesignation" placeholder="Designation"><button>Add</button></form><div id="facs"></div></article></section></main><script src="admin-modules.js"></script></body></html>
