<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Login | Qazi Institute</title><link rel="stylesheet" href="auth.css"></head><body>
<main class="auth-page">
<section class="visual-panel"><div class="visual-content"><div class="mark">🎓</div><span class="kicker">QAZI INSTITUTE</span><h2>Learn. Grow.<br><em>Achieve.</em></h2><p>Your academic journey, attendance, results and notices — all in one secure student portal.</p><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="book">📚</div></div></section>
<section class="login-panel"><div class="login-box"><div class="mini-logo">🎓</div><span class="eyebrow">STUDENT PORTAL</span><h1>Welcome back</h1><p class="subtitle">Sign in to continue to your Qazi Institute dashboard.</p>
<form id="loginForm"><label for="email">Registered Gmail</label><input id="email" type="email" placeholder="you@example.com" required autocomplete="off"><label for="rollNumber">Roll Number</label><input id="rollNumber" type="text" placeholder="Enter your roll number" required autocomplete="off"><label for="password">Password</label><div class="password-field"><input id="password" type="password" placeholder="Enter your password" required autocomplete="current-password"></div><label class="check"><input type="checkbox" id="togglePassword"> <span>Show password</span></label><button type="submit"><span>Login to Student Portal</span><b>→</b></button></form><div id="error"></div><div class="switch">Are you an administrator? <a href="admin-login.html">Admin Login</a></div></div></section>
</main><script src="auth.js"></script></body></html>
