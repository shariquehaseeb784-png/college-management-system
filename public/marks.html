<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marks Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="main-nav">
    <a href="dashboard.html">🏠 Dashboard</a>
    <a href="index.html">👨‍🎓 Students</a>
    <a href="attendance.html">📅 Attendance</a>
    <a href="marks.html">📝 Marks</a>
    <a href="result.html">📊 Results</a>
</nav>

    <div class="container">

        <h1>Marks Management</h1>

        <div class="card">

            <h2>Add Marks</h2>

            <form id="marksForm">

                <select id="student" required>
                    <option value="">Select Student</option>
                </select>

                <input
                    type="text"
                    id="subject"
                    placeholder="Subject"
                    required
                >

                <input
                    type="number"
                    id="marks"
                    placeholder="Marks (0-100)"
                    min="0"
                    max="100"
                    required
                >

                <button type="submit">
                    Add Marks
                </button>

            </form>

        </div>


        <div class="card">

            <h2>Marks Records</h2>

            <table>

                <thead>

                    <tr>
                        <th>Student</th>
                        <th>Roll Number</th>
                        <th>Subject</th>
                        <th>Marks</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="marksList"></tbody>

            </table>

        </div>

    </div>


    <script src="marks.js"></script>

</body>
</html>
